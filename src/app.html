<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Learn electronics from first principles — offline, with exact formulas and interactive circuits."
		/>
		<meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121713" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<title>CircuitPath</title>
		<script>
			// Apply stored appearance before first paint (no flash).
			try {
				const d = document.documentElement;
				const theme = localStorage.getItem('cp.theme');
				if (theme === 'light' || theme === 'dark') d.dataset.theme = theme;
				const size = localStorage.getItem('cp.textSize');
				if (size) d.dataset.textSize = size;
				if (localStorage.getItem('cp.reducedMotion') === 'true') d.dataset.reducedMotion = 'true';
			} catch {
				/* storage blocked */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
